server:
  port: 8081
  tomcat:
    max-swallow-size: 50MB
    max-http-form-post-size: 50MB
    max-parameter-count: 1000

spring:
  application:
    name: psicologico-api
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
  
  datasource:
    url: jdbc:postgresql://localhost:5437/gabinete_psicologico
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
jwt:
  secret: Y2xhdmUtc2VjcmV0YS1nYWJpbmV0ZS1wc2ljb2xvZ2ljby0yMDI2LXNlZ3VyYQ==
  expiration: 86400000

logging:
  level:
    org.flywaydb: DEBUG